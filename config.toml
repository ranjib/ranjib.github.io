baseURL = 'https://ranjib.github.io'
defaultContentLanguage = 'en'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[related]
  threshold = 40
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = 'lane'
    weight = 80
  [[related.indices]]
    name = 'tags'
    weight = 60
  [[related.indices]]
    name = 'date'
    weight = 10

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    lineNos = false
    tabWidth = 2

  [markup.goldmark.renderer]
    unsafe = false

[params]
profilePicture = 'images/profile.jpeg'
title = 'Ranjib Dey'
description = 'Systems in Practice: engineering reliable systems across production infrastructure, AI agents, open-source hardware, gardens, and field adventures.'
positioning = 'Systems in Practice'

  [params.author]
  name = 'Ranjib Dey'
  url = 'https://ranjib.github.io/about/personal/'

  [params.social]
