schema_version: editorial-research-sources-v1
updated_at: 2026-08-27
authority_levels:
  primary: Official project, vendor, standards, research, or source-owner material.
  ecosystem: High-context ecosystem sources, maintainers, foundations, or major engineering teams.
  practitioner: Detailed practitioner reports with enough evidence to verify.
  secondary: Aggregators, social posts, newsletters, and SEO summaries.
