name: build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.162.1"

jobs:
  hugo:
    name: hugo build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        run: hugo --gc --minify

      - name: Validate metadata
        run: node scripts/validate-metadata.mjs

      - name: Validate content model
        run: node scripts/validate-content-model.mjs

      - name: Validate RSS
        run: node scripts/validate-rss.mjs

      - name: Validate crawl files
        run: node scripts/validate-crawl.mjs

      - name: Validate distribution workflow
        run: node scripts/validate-distribution.mjs

      - name: Validate brand kit
        run: node scripts/validate-brand.mjs
