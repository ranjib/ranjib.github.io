name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  HUGO_VERSION: "0.162.1"

jobs:
  build:
    name: build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Validate metadata
        run: node scripts/validate-metadata.mjs

      - name: Validate content model
        run: node scripts/validate-content-model.mjs

      - name: Check approved photo insertions
        run: node scripts/apply-approved-photos.mjs --check

      - name: Validate approved photos
        run: node scripts/validate-approved-photos.mjs

      - name: Validate RSS
        run: node scripts/validate-rss.mjs

      - name: Validate crawl files
        run: node scripts/validate-crawl.mjs

      - name: Validate distribution workflow
        run: node scripts/validate-distribution.mjs

      - name: Validate brand kit
        run: node scripts/validate-brand.mjs

      - name: Validate canonical domain
        run: node scripts/validate-domain.mjs

      - name: Validate editorial radar
        run: node scripts/validate-editorial-radar.mjs

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
