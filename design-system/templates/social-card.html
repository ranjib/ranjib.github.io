<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Card Templates</title>
  <style id="tokens">/* tokens injected below for standalone preview */</style>
  <script>
    fetch('../tokens.css').then(r => r.text()).then(css => {
      document.getElementById('tokens').textContent = css;
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: var(--s-8);
      color: var(--text);
      background: var(--bg);
      font-family: var(--font-sans);
    }
    .social-card-preview {
      aspect-ratio: 1200 / 630;
      max-width: var(--content-max);
      border: 1px solid var(--hairline);
      background: var(--surface-alt);
      padding: var(--s-8);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .social-card-kicker {
      color: var(--link);
      font-size: var(--fs-lg);
      font-weight: 600;
      letter-spacing: var(--tr-wide);
      text-transform: uppercase;
      margin: 0;
    }
    .social-card-title {
      color: var(--text);
      font-family: var(--font-serif);
      font-size: var(--fs-4xl);
      font-weight: 600;
      letter-spacing: var(--tr-tight);
      line-height: var(--lh-tight);
      margin: var(--s-7) 0 var(--s-4);
      max-width: var(--measure-prose);
    }
    .social-card-subtitle {
      color: var(--text-muted);
      font-size: var(--fs-xl);
      line-height: var(--lh-snug);
      margin: 0;
      max-width: var(--measure-prose);
    }
    .social-card-footer {
      align-items: center;
      border-top: 1px solid var(--hairline);
      color: var(--text-meta);
      display: flex;
      font-size: var(--fs-lg);
      justify-content: space-between;
      padding-top: var(--s-5);
    }
  </style>
</head>
<body>
  <article class="social-card-preview" aria-label="Article social preview card">
    <div>
      <p class="social-card-kicker">Systems in Practice</p>
      <h1 class="social-card-title">Context Engineering Evals Remind Me of Infrastructure Testing</h1>
      <p class="social-card-subtitle">From TDD in operations to agent evals.</p>
    </div>
    <footer class="social-card-footer">
      <span>Ranjib Dey</span>
      <span>ranjib.github.io</span>
    </footer>
  </article>
</body>
</html>
